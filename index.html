<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>树洞诗集</title>
  <meta name="description" content="输入一句今天的心情，让树洞为你写一首小诗。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23f6dfa4'/%3E%3Cpath d='M50 16 L58 42 L84 50 L58 58 L50 84 L42 58 L16 50 L42 42 Z' fill='%23e8a74a'/%3E%3Ccircle cx='22' cy='24' r='4' fill='%23e8a74a'/%3E%3Ccircle cx='80' cy='76' r='3' fill='%23e8a74a'/%3E%3C/svg%3E">
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <!-- 手绘笔触背景（canvas 绘制） -->
  <canvas id="brush" aria-hidden="true"></canvas>

  <canvas id="dust" aria-hidden="true"></canvas>
  <div id="grain" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none">
          <path d="M12 3 L14 10 L21 12 L14 14 L12 21 L10 14 L3 12 L10 10 Z" fill="currentColor"/>
        </svg>
      </span>
      <span class="brand-name">树洞诗集</span>
    </div>
    <button id="sound-toggle" class="icon-btn" type="button" aria-label="开启环境音" title="环境音">
      <svg id="icon-sound-off" viewBox="0 0 24 24" width="19" height="19" fill="none" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <svg id="icon-sound-on" viewBox="0 0 24 24" width="19" height="19" fill="none" aria-hidden="true" class="hidden">
        <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </header>

  <main id="app">
    <section id="home" class="view">
      <div class="home-inner">
        <p class="tagline">把今天的心情，说给树洞听</p>
        <form id="poem-form" class="poem-form" autocomplete="off">
          <input
            id="mood-input"
            type="text"
            maxlength="60"
            placeholder="今天的心情，说给树洞听…"
            aria-label="今天的心情"
            autofocus
          >
          <button id="submit-btn" class="submit-btn" type="submit">说给树洞</button>
        </form>
        <p id="example-hint" class="example-hint">比如：今天看到晚霞，想发给一个人</p>
        <p id="guidance" class="guidance hidden">树洞听见了。还想再放一首吗？</p>
      </div>
    </section>

    <section id="poem-view" class="view hidden" aria-hidden="true">
      <div id="poem" class="poem" aria-live="polite"></div>
      <div class="actions">
        <button id="again-btn" class="ghost-btn" type="button">换一首</button>
        <button id="ai-btn" class="ghost-btn" type="button">让 AI 写</button>
      </div>
      <p class="poem-hint">点击屏幕，让诗散开</p>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
