<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>树洞诗集</title>
  <meta name="description" content="输入一句今天的心情，让树洞为你写一首小诗。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23f6e3b4'/%3E%3Cpath d='M50 16 L58 42 L84 50 L58 58 L50 84 L42 58 L16 50 L42 42 Z' fill='%23d99a3f'/%3E%3C/svg%3E">
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <!-- 会动的手绘泼墨涂鸦背景 -->
  <canvas id="ink" aria-hidden="true"></canvas>

  <canvas id="dust" aria-hidden="true"></canvas>
  <div id="grain" aria-hidden="true"></div>

  <!-- 散开时的光晕脉冲 -->
  <div id="pulse" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
          <path d="M12 2.5 L14 10 L21.5 12 L14 14 L12 21.5 L10 14 L2.5 12 L10 10 Z" fill="currentColor"/>
        </svg>
      </span>
      <span class="brand-name">树洞诗集</span>
    </div>
    <button id="manage-btn" class="manage-entry" type="button" title="诗库管理">✎ 诗库</button>
    <button id="sound-toggle" class="icon-btn" type="button" aria-label="开启环境音" title="环境音">
      <svg id="icon-sound-off" viewBox="0 0 24 24" width="19" height="19" fill="none" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <svg id="icon-sound-on" viewBox="0 0 24 24" width="19" height="19" fill="none" aria-hidden="true" class="hidden">
        <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </header>

  <main id="app">
    <!-- 首页：随手勾了个框，把心事写进去 -->
    <section id="home" class="view">
      <div class="home-inner">
        <p class="tagline">把今天的心情，写进树洞</p>
        <div class="sketch-frame" id="sketch">
          <form id="poem-form" class="poem-form" autocomplete="off">
            <input
              id="mood-input"
              type="text"
              maxlength="60"
              placeholder="写在这里，像说悄悄话…"
              aria-label="今天的心情"
              autofocus
            >
            <button id="candle-btn" class="candle" type="submit" aria-label="点蜡烛，寄出心事" title="点蜡烛寄出（或按回车）">
              <svg viewBox="0 0 64 96" width="40" height="60" fill="none" aria-hidden="true">
                <path class="flame" d="M32 10 C 37 18, 45 24, 41 34 C 38 42, 26 42, 23 34 C 19 24, 27 18, 32 10 Z" fill="#f4c35f"/>
                <path class="flame-core" d="M32 21 C 35 26, 38 30, 36 35 C 34 39, 30 39, 28 35 C 26 30, 29 26, 32 21 Z" fill="#fff3cf"/>
                <rect class="wax" x="27.5" y="42" width="9" height="38" rx="3.5" fill="rgba(255,251,238,0.4)" stroke="#46335c" stroke-width="2"/>
                <path d="M27.5 47 C 30 49, 34 49, 36.5 47" stroke="#46335c" stroke-width="1.4" fill="none"/>
                <path d="M27.5 62 C 25 66, 25.5 71, 27.5 76" stroke="#46335c" stroke-width="1.4" fill="none" opacity="0.55"/>
              </svg>
            </button>
          </form>
          <p class="form-hint">点一点蜡烛，或者按一下回车</p>
        </div>
        <p id="example-hint" class="example-hint">比如：今天看到晚霞，想发给一个人</p>
        <p id="guidance" class="guidance hidden">树洞听见了。还想再放一首吗？</p>
      </div>
    </section>

    <!-- 诗页 -->
    <section id="poem-view" class="view hidden" aria-hidden="true">
      <div class="doodle doodle-left" aria-hidden="true">✦</div>
      <div class="doodle doodle-right" aria-hidden="true">❀</div>
      <div id="poem" class="poem" aria-live="polite"></div>
      <div class="actions">
        <button id="again-btn" class="text-btn" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true"><path d="M12 3 C7 3 3 7 3 12 M3 12 V5 M3 12 H10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>换一首</span>
        </button>
        <button id="ai-btn" class="text-btn" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true"><path d="M12 3 L14 9 L20 11 L14 13 L12 19 L10 13 L4 11 L10 9 Z" fill="currentColor"/></svg>
          <span>让 AI 写</span>
        </button>
      </div>
      <p class="poem-hint">点一下画面，让诗散开</p>
    </section>

    <!-- 诗库管理 -->
    <section id="manage" class="manage-view hidden" aria-hidden="true">
      <div class="manage-head">
        <button id="manage-back" class="m-back" type="button">← 返回</button>
        <h2 class="manage-title">诗库管理</h2>
        <span id="manage-save-hint" class="manage-save-hint"></span>
      </div>
      <p class="manage-tip">在这里增删改诗：改动自动保存在「本机浏览器」，刷新后依然生效；点「导出」可拿回完整的 poems.js，点「发布」可提交到 GitHub 让全站更新。</p>
      <div class="manage-toolbar">
        <button id="manage-export" class="m-btn" type="button">导出 poems.js</button>
        <button id="manage-reset" class="m-btn ghost" type="button">恢复内置诗库</button>
      </div>
      <details class="manage-pub">
        <summary>发布到 GitHub（可选）</summary>
        <div class="manage-pub-body">
          <label class="m-field">仓库 <input id="manage-repo" type="text" value="ElaineCai216/treehole-poetry"></label>
          <label class="m-field">Token <input id="manage-token" type="password" placeholder="fine-grained token（仅本仓库读写）"></label>
          <div class="manage-pub-actions">
            <button id="manage-publish" class="m-btn" type="button">发布到 GitHub</button>
            <button id="manage-clear-token" class="m-btn ghost" type="button">清除 Token</button>
            <span id="manage-pub-status" class="manage-pub-status"></span>
          </div>
        </div>
      </details>
      <div id="manage-list" class="manage-list"></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
