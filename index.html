<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>树洞诗集</title>
  <meta name="description" content="输入一句今天的心情，让树洞为你写一首小诗。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2326104a'/%3E%3Cpath d='M62 14 A38 38 0 1 0 62 86 A30 30 0 1 1 62 14' fill='%23f6ecc4'/%3E%3Ccircle cx='22' cy='24' r='3' fill='%23fcefbe'/%3E%3Ccircle cx='80' cy='72' r='2.4' fill='%23fcefbe'/%3E%3C/svg%3E">
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <!-- 绘本场景层（夜空 / 水彩洗色 / 月亮 / 星星 / 树洞 / 山丘） -->
  <div class="scene" aria-hidden="true">
    <div class="wash wash-1"></div>
    <div class="wash wash-2"></div>
    <div class="wash wash-3"></div>

    <div class="moon" aria-hidden="true">
      <svg viewBox="0 0 100 100" width="64" height="64" fill="none">
        <path d="M64 12 A40 40 0 1 0 64 88 A32 32 0 1 1 64 12" fill="#f6ecc4"/>
      </svg>
    </div>

    <div class="stars" id="stars"></div>

    <!-- 发光树洞 -->
    <div class="tree" aria-hidden="true">
      <div class="foliage foliage-1"></div>
      <div class="foliage foliage-2"></div>
      <div class="foliage foliage-3"></div>
      <div class="foliage foliage-4"></div>
      <div class="trunk"></div>
      <div class="hole-glow"></div>
      <div class="hole"></div>
      <div class="bird" aria-hidden="true">
        <svg viewBox="0 0 40 30" width="34" height="26" fill="none">
          <ellipse cx="20" cy="22" rx="13" ry="7" fill="#241139"/>
          <circle cx="20" cy="17" r="6.5" fill="#2c4a3f"/>
          <circle cx="22.5" cy="15.5" r="1.6" fill="#241139"/>
          <path d="M26 14.5 q5 1.5 4 6" stroke="#2c4a3f" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <!-- 底部山丘剪影 -->
    <svg class="hills" viewBox="0 0 1440 260" preserveAspectRatio="none" fill="none">
      <path d="M0 160 Q 240 70 480 150 T 960 120 T 1440 150 L 1440 260 L 0 260 Z" fill="#1b0d30"/>
      <path d="M0 200 Q 300 130 620 190 T 1440 175 L 1440 260 L 0 260 Z" fill="#241139"/>
      <g fill="#180b2b">
        <rect x="180" y="148" width="7" height="30" rx="3"/>
        <circle cx="183.5" cy="142" r="16"/>
        <rect x="1120" y="150" width="6" height="26" rx="3"/>
        <circle cx="1123" cy="145" r="14"/>
      </g>
    </svg>
  </div>

  <canvas id="dust" aria-hidden="true"></canvas>
  <div id="grain" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
          <path d="M16 3.5 A9 9 0 1 0 16 20.5 A7.2 7.2 0 1 1 16 3.5" fill="currentColor"/>
        </svg>
      </span>
      <span class="brand-name">树洞诗集</span>
    </div>
    <button id="sound-toggle" class="icon-btn" type="button" aria-label="开启环境音" title="环境音">
      <svg id="icon-sound-off" viewBox="0 0 24 24" width="19" height="19" fill="none" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <svg id="icon-sound-on" viewBox="0 0 24 24" width="19" height="19" fill="none" aria-hidden="true" class="hidden">
        <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </header>

  <main id="app">
    <section id="home" class="view">
      <div class="home-inner">
        <p class="tagline">把今天的心情，说给树洞听</p>
        <form id="poem-form" class="poem-form" autocomplete="off">
          <input
            id="mood-input"
            type="text"
            maxlength="60"
            placeholder="今天的心情，说给树洞听…"
            aria-label="今天的心情"
            autofocus
          >
          <button id="submit-btn" class="submit-btn" type="submit">说给树洞</button>
        </form>
        <p id="example-hint" class="example-hint">比如：今天看到晚霞，想发给一个人</p>
        <p id="guidance" class="guidance hidden">树洞听见了。还想再放一首吗？</p>
      </div>
    </section>

    <section id="poem-view" class="view hidden" aria-hidden="true">
      <div id="poem" class="poem" aria-live="polite"></div>
      <div class="actions">
        <button id="again-btn" class="ghost-btn" type="button">换一首</button>
        <button id="ai-btn" class="ghost-btn" type="button">让 AI 写</button>
      </div>
      <p class="poem-hint">点击屏幕，让诗散开</p>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
